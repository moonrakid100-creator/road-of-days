name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor
        run: |
          mkdir -p www
          cp -r index.html Road_of_Days* manifest.json sw.js icon*.png www/ 2>/dev/null || true
          
          npm install --save @capacitor/core@6 @capacitor/android@6 @capacitor/local-notifications@6
          npm install --save-dev @capacitor/cli@6
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          
          # สกัด URL ของ Gradle แล้วเปลี่ยนเป็น -bin.zip (ขนาดเล็กกว่าครึ่งหนึ่ง)
          RAW_URL=$(grep 'distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2- | tr -d '\\')
          BIN_URL=$(echo "$RAW_URL" | sed 's/-all.zip/-bin.zip/')
          
          echo "Downloading Gradle from $BIN_URL with curl..."
          curl -fL --retry 5 --retry-delay 2 -o /tmp/gradle-dist.zip "$BIN_URL"
          
          # เปลี่ยนให้ Gradle Wrapper โหลดจากไฟล์ในเครื่องทันที ป้องกัน Timeout 100%
          sed -i 's|distributionUrl=.*|distributionUrl=file\\:///tmp/gradle-dist.zip|' gradle/wrapper/gradle-wrapper.properties
          
          # บิลด์ไฟล์ APK
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Road_of_Days_Chiangrai_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
